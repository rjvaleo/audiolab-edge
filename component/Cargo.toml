[package]
name = "audiolab-edge"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Gzip, both ends: `build.rs` compresses every text asset at build time and the
# component decompresses for the rare client that does not accept gzip.
# Pure-Rust backend, so it compiles for wasm32-wasip2 with nothing to configure.
flate2 = "1"
anyhow = "1"
spin-sdk = "3"

# Small, because everything ships inside the component.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
flate2 = "1"
