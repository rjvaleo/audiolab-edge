spin_manifest_version = 2

[application]
name = "audiolab-edge"
version = "0.1.0"
authors = ["Richard Valeo"]
description = "Granular audio, at the edge. One page, one sound, one visual."

# **Akamai Functions, named here so the build checks itself against it.**
#
# `spin build` resolves this against spinframework/spin-environments, fetches
# the WIT world Akamai actually provides, and validates the component's imports
# and exports against it — before anybody tries to deploy. That check is the
# whole reason this key is worth having: it turns "we think it will load" into
# a line of build output.
#
# It tries each world the environment offers, in order. The two async worlds
# (http-trigger-async@1.1.0) are rejected because they require a
# `wasi:http/handler@0.3.0` export, which is wasip3 — Rust cannot emit it. It
# then validates against `akamai:functions/http-trigger@1.0.0` and passes.
#
# Note `spin targets update` does NOT exist in Spin 4.0.2; that subcommand is
# unreleased. Nothing needs to be run first — `spin build` fetches what it needs.
targets = ["akamai-functions"]

[[trigger.http]]
route = "/..."
component = "audiolab-edge"

[component.audiolab-edge]
source = "component/target/wasm32-wasip2/release/audiolab_edge.wasm"
# No `files` key on purpose. Everything is compiled into the component with
# `include_bytes!` rather than mounted into a WASI filesystem — see
# `docs/PLAN.md`.

[component.audiolab-edge.build]
# The engine first: the component embeds the .wasm the engine build produces,
# so a component built before it would embed the previous one — or fail to
# build at all on a clean checkout.
command = "cargo build --release --manifest-path ../engine/Cargo.toml --target wasm32-unknown-unknown && cargo build --release --target wasm32-wasip2"
workdir = "component"
# `../engine/vendor/**/*.rs` is in here because the vendored crates are now the
# engine's actual source. Without it `spin watch` rebuilds for a change to
# engine/src and sits still for a change to the DSP underneath it.
watch = [
  "src/**/*.rs",
  "../ui/**/*",
  "../engine/src/**/*.rs",
  "../engine/vendor/**/*.rs",
  "../sounds/**/*",
  "Cargo.toml",
]
