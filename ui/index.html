<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audiolab</title>
<style>
  :root { --bg:#040607; --ink:#e7ebe9; --mute:#6f7b79; --line:#1c2225; --sig:#5fd47a; --warn:#d98a63; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    overflow: hidden;
  }
  /* The room is the page. Everything else sits over it. */
  #room { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; gap: 1.4rem;
    padding: .9rem clamp(.9rem, 3vw, 1.6rem);
    background: linear-gradient(to top, rgba(4,6,7,.92), rgba(4,6,7,0));
    flex-wrap: wrap;
  }
  h1 {
    position: fixed; top: clamp(.9rem,3vw,1.6rem); left: clamp(.9rem,3vw,1.6rem);
    margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .01em;
    text-shadow: 0 1px 12px rgba(0,0,0,.8);
  }
  h1 span { color: var(--mute); font-weight: 400; }
  button {
    font: inherit; font-weight: 600; color: #040607; background: var(--sig);
    border: 0; border-radius: 3px; padding: .5rem 1.2rem; cursor: pointer;
  }
  button:disabled { background: var(--line); color: var(--mute); cursor: default; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .stat { color: var(--mute); }
  .stat b { color: var(--ink); font-weight: 400; }
  .on { color: var(--sig); }
  .bad { color: var(--warn); }
</style>

<canvas id="room"></canvas>
<h1>Audiolab <span>· granular audio at the edge</span></h1>

<div class="bar">
  <button id="go" disabled>Loading…</button>
  <span class="stat" id="s-src">—</span>
  <span class="stat" id="s-ren">—</span>
  <span class="stat" id="s-note"></span>
</div>

<!-- Classic script on purpose: this is the desktop build's file, unchanged,
     and it declares `vgAttach` at the top level the way that build expects. -->
<script src="./vis-gl.js"></script>
<script type="module" src="./app.js"></script>
